<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="clocheGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C215"/>
      <stop offset="100%" stop-color="#008810"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00AA13" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Food Cloche - Left Half -->
    <path d="M 238 126
             A 20 20 0 0 0 220 144
             L 220 156
             A 160 160 0 0 0 96 312
             L 238 312
             Z"
          fill="url(#clocheGrad)"/>

    <!-- Food Cloche - Right Half -->
    <path d="M 274 126
             A 20 20 0 0 1 292 144
             L 292 156
             A 160 160 0 0 1 416 312
             L 274 312
             Z"
          fill="url(#clocheGrad)"/>

    <!-- Top Handle Knob Top Arc -->
    <path d="M 238 126 C 238 116 246 108 256 108 C 266 108 274 116 274 126 Z" fill="url(#clocheGrad)"/>

    <!-- Serving Platter Tray - Left Half -->
    <rect x="76" y="332" width="162" height="28" rx="14" fill="url(#clocheGrad)"/>

    <!-- Serving Platter Tray - Right Half -->
    <rect x="274" y="332" width="162" height="28" rx="14" fill="url(#clocheGrad)"/>

    <!-- Center Discount Token Badge -->
    <g transform="translate(256, 240)">
      <circle r="64" fill="#FFFFFF"/>
      <circle r="56" fill="url(#badgeGrad)"/>

      <!-- Promo Percent Symbol -->
      <line x1="22" y1="-24" x2="-22" y2="24" stroke="#004D0A" stroke-width="12" stroke-linecap="round"/>
      <circle cx="-15" cy="-15" r="9" fill="#004D0A"/>
      <circle cx="15" cy="15" r="9" fill="#004D0A"/>
    </g>
  </g>
</svg>

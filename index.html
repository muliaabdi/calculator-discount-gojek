                                    this.showToast('Gambar struk diunduh ke galeri/file');
                                }
                                if (typeof confetti === 'function') {
                                    confetti({ particleCount: 35, spread: 60, origin: { y: 0.6 } });
                                }
                            } catch (err) {
                                const link = document.createElement('a');
                                link.download = 'struk-patungan.png';
                                link.href = canvas.toDataURL('image/png');
                                link.click();
                                this.showToast('Gambar struk diunduh!');
                            } finally {
                                this.copyingImage = false;
                            }
                        }, 'image/png');
                    } catch (err) {
                        console.error(err);
                        this.copyingImage = false;
                        this.showToast('Gagal membuat gambar struk');
                    }
                },
                async downloadImageReceipt() {
                    const el = document.getElementById('receipt-card');
                    if (!el || typeof html2canvas !== 'function') {
                        this.showToast('Fitur gambar belum siap');
                        return;
                    }
                    this.copyingImage = true;
                    try {
                        const h2cOptions = {
                            scale: 3,
                            backgroundColor: '#DCF8C6',
                            useCORS: true,
                            logging: false,
                            scrollY: 0,
                            scrollX: 0,
                            onclone: (clonedDoc) => {
                                const clonedEl = clonedDoc.getElementById('receipt-card');
                                if (clonedEl) {
                                    clonedEl.style.overflow = 'visible';
                                    let parent = clonedEl.parentElement;
                                    while (parent && parent !== clonedDoc.body) {
                                        parent.style.overflow = 'visible';
                                        parent.style.maxHeight = 'none';
                                        parent.style.height = 'auto';
                                        parent = parent.parentElement;
                                    }
                                }
                            }
                        };
                        const canvas = await html2canvas(el, h2cOptions);
                        const link = document.createElement('a');
                        link.download = 'struk-patungan.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        this.showToast('Gambar struk berhasil diunduh!');
                        if (typeof confetti === 'function') {
                            confetti({ particleCount: 35, spread: 60, origin: { y: 0.6 } });
                        }
                    } catch (err) {
                        console.error(err);
                        this.showToast('Gagal mengunduh gambar');
                    } finally {
                        this.copyingImage = false;
                    }
                },

                // OCR Methods
                async handleReceiptImageUpload(evt) {
                    const file = evt.target.files && evt.target.files[0];
                    if (!file) return;
                    evt.target.value = '';

                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        this.ocrPreviewUrl = e.target.result;
                        this.showOcrModal = true;
                        this.ocrScanning = true;
                        this.ocrProgress = 5;
                        this.ocrStatus = 'Memuat OCR Engine...';
                        this.ocrTab = 'result';
                        this.ocrResult = {
                            subtotal: null,
                            total: null,
                            items: [],
                            rawText: ''
                        };

                        try {
                            await this.processOcrImage(this.ocrPreviewUrl);
                        } catch (err) {
                            console.error('OCR Error:', err);
                            this.ocrScanning = false;
                            this.ocrStatus = 'Gagal memindai gambar struk.';
                            this.showToast('Gagal memindai struk. Coba foto lebih jelas.');
                        }
                    };
                    reader.readAsDataURL(file);
                },

                loadTesseract() {
                    return new Promise((resolve, reject) => {
                        if (window.Tesseract) return resolve(window.Tesseract);
                        const script = document.createElement('script');
                        script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
                        script.onload = () => resolve(window.Tesseract);
                        script.onerror = () => reject(new Error('Gagal memuat Tesseract.js'));
                        document.head.appendChild(script);
                    });
                },

                preprocessImage(dataUrl) {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;

                            // Upscale low-res cropped images so characters have enough pixels for Tesseract
                            const minDimension = Math.min(width, height);
                            if (minDimension < 700) {
                                const scale = Math.min(3.5, 950 / minDimension);
                                width = Math.round(width * scale);
                                height = Math.round(height * scale);
                            } else if (width > 2200 || height > 2200) {
                                const maxDim = 2200;
                                const scale = maxDim / Math.max(width, height);
                                width = Math.round(width * scale);
                                height = Math.round(height * scale);
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'high';
                            ctx.drawImage(img, 0, 0, width, height);

                            // Gentle contrast & grayscale to preserve fine character strokes without clipping
                            try {
                                const imgData = ctx.getImageData(0, 0, width, height);
                                const d = imgData.data;
                                for (let i = 0; i < d.length; i += 4) {
                                    const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                                    const contrast = (gray - 128) * 1.15 + 128;
                                    const finalVal = Math.min(255, Math.max(0, contrast));
                                    d[i] = finalVal;
                                    d[i + 1] = finalVal;
                                    d[i + 2] = finalVal;
                                }
                                ctx.putImageData(imgData, 0, 0);
                            } catch (e) { }
                            resolve(canvas.toDataURL('image/png'));
                        };
                        img.src = dataUrl;
                    });
                },

                async processOcrImage(rawUrl) {
                    this.ocrStatus = 'Mengoptimalkan kontras struk...';
                    this.ocrProgress = 15;
                    const processedUrl = await this.preprocessImage(rawUrl);

                    this.ocrStatus = 'Menyiapkan modul OCR (Indonesian)...';
                    this.ocrProgress = 25;
                    const Tesseract = await this.loadTesseract();

                    this.ocrStatus = 'Membaca teks dari gambar struk...';
                    const result = await Tesseract.recognize(processedUrl, 'ind+eng', {
                        logger: (m) => {
                            if (m.status === 'recognizing text') {
                                this.ocrProgress = 25 + Math.round(m.progress * 70);
                                this.ocrStatus = `Membaca teks (${Math.round(m.progress * 100)}%)...`;
                            }
                        }
                    });

                    this.ocrProgress = 100;
                    this.ocrScanning = false;
                    const text = result && result.data && result.data.text ? result.data.text : '';
                    this.ocrResult = this.parseReceiptText(text);

                    if (this.ocrResult.items.length === 0 && !this.ocrResult.total && !this.ocrResult.subtotal) {
                        this.ocrStatus = 'Teks terbaca, namun format angka/menu belum terdeteksi. Silakan periksa tab teks mentah.';
                    } else {
                        this.ocrStatus = `Berhasil mendeteksi ${this.ocrResult.items.length} item menu!`;
                        this.showToast(`Berhasil mendeteksi ${this.ocrResult.items.length} item menu`);
                    }
                },

                parseReceiptText(text) {
                    if (!text) return { subtotal: null, total: null, items: [], rawText: '' };
                    const rawLines = text.split('\n')
                        .map(l => l.replace(/^[\|\s\-=_*#]+|[\|\s\-=_*#]+$/g, '').trim())
                        .filter(Boolean);

                    const items = [];
                    let detectedSubtotal = null;
                    let detectedTotal = null;

                    const extractNumbers = (str) => {
                        if (!str) return [];
                        const matches = str.match(/(?:rp\.?\s*)?(\d{1,3}(?:[\.,]\d{3})+|\d{3,7})/gi);
                        if (!matches) return [];
                        return matches.map(m => {
                            const clean = m.replace(/[^0-9]/g, '');
                            return parseInt(clean, 10);
                        }).filter(n => !isNaN(n));
                    };

                    const isDashedOrSeparator = (line) => /^[\-=_*.]{3,}$/.test(line);

                    const isIgnoredRow = (lower) => {
                        return /^(dine\s*in|take\s*away|takeaway|order|table|meja|kasir|cashier|tgl|tanggal|date|waktu|jam|bill|receipt|no\.|no\s*:|nota)/i.test(lower) ||
                               /^(tax|tex|pb1|pb\s*1|pajak|ppn|service|sc\b|biaya|ongkir|voucher|promo|diskon|discount)/i.test(lower) ||
                               /^(mandiri|bca|bni|bri|debit|kredit|credit|qris|tunai|cash|gopay|ovo|dana|shopeepay|kembali|kembalian|change)/i.test(lower) ||
                               /^(terima|thank|matur|kunjungan|wifi|password|lunas|paid|selamat)/i.test(lower) ||
                               /^(sub\s*total|sb\s*total|sbtol|sbtl|subttl|sub-total|sub\s*tot|sb\s*tot)/i.test(lower) ||
                               /^(grand\s*total|total\b|tolal|tota[l1|])/i.test(lower) ||
                               /^\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4}/.test(lower) ||
                               /^\d{1,2}:\d{2}/.test(lower);
                    };

                    const isQtyPriceLine = (line) => {
                        const trimmed = line.trim();
                        return /^(?:[0-9tiI|]+[\s\.\,]*x|x\s*\d+|[0-9tiI|]+\s*@|@\s*\d+|\d+\s*pcs|\d+\s*porsi|\d+\s+\d{1,3}[\.,]\d{3}|\d{1,3}[\.,]\d{3}\s*x)/i.test(trimmed) ||
                               /^[0-9tiI|\s\.xX@\,]+$/.test(trimmed);
                    };

                    const cleanItemName = (name) => {
                        let clean = name
                            .replace(/^[\d\s\.\-xX•*#\[\]\(\)]+/, '')
                            .replace(/@[a-zA-Z0-9_\.]+/g, '')
                            .replace(/^[£$]5\s+/i, 'ES ')
                            .replace(/^e5\s+/i, 'ES ')
                            .replace(/[\.\:,\|\-_@\s]+$/, '')
                            .trim();
                        if (clean.length < 3 && !['mi', 'es'].includes(clean.toLowerCase())) {
                            clean = `Menu ${items.length + 1}`;
                        }
                        return clean;
                    };

                    for (let i = 0; i < rawLines.length; i++) {
                        const line = rawLines[i];
                        const lower = line.toLowerCase();

                        if (isDashedOrSeparator(line)) continue;

                        // Detect Subtotal (e.g. Subtotal, Sub Total, sb Total, sbtol, sbtl, subttl)
                        if (/(?:^|\b)(sub\s*total|sb\s*total|sbtol|sbtl|subttl|sub-total|sub\s*tot|sb\s*tot|total\s*pesanan|total\s*menu|harga\s*makanan)(?:\b|$)/i.test(lower)) {
                            let nums = extractNumbers(line);
                            if (nums.length === 0 && i + 1 < rawLines.length) {
                                nums = extractNumbers(rawLines[i + 1]);
                            }
                            if (nums.length > 0 && !detectedSubtotal) {
                                detectedSubtotal = nums[nums.length - 1];
                            }
                            continue;
                        }

                        // Detect Grand Total / Total
                        if (/(?:^|\b)(grand\s*total|total\s*bayar|total\s*akhir|total\s*tagihan|total\s*pembayaran|total|tolal|tota[l1|]|tot\b)(?:\b|$)/i.test(lower)) {
                            if (!lower.includes('item') && !lower.includes('qty') && !lower.includes('porsi') && !lower.includes('diskon')) {
                                let nums = extractNumbers(line);
                                if (nums.length === 0 && i + 1 < rawLines.length) {
                                    nums = extractNumbers(rawLines[i + 1]);
                                }
                                if (nums.length > 0 && !detectedTotal) {
                                    detectedTotal = nums[nums.length - 1];
                                }
                                continue;
                            }
                        }

                        if (isIgnoredRow(lower)) continue;

                        // Pattern 1: Same-line item
                        const sameLineMatch = line.match(/^(.+?)(?:\s+|[\.:\-_=]+)\s*(?:rp\.?\s*)?(\d{1,3}(?:[\.,]\d{3})+|\d{3,7})$/i);
                        if (sameLineMatch) {
                            const nameCandidate = cleanItemName(sameLineMatch[1]);
                            const price = parseInt(sameLineMatch[2].replace(/[\.,]/g, ''), 10);
                            if (nameCandidate.length >= 2 && price > 0 && !isIgnoredRow(nameCandidate.toLowerCase())) {
                                items.push({
                                    name: nameCandidate,
                                    price: this.formatNumber(price)
                                });
                                continue;
                            }
                        }

                        // Pattern 2: Two-line item (Line i: Name, Line i+1: Qty/Price)
                        if (i + 1 < rawLines.length) {
                            const nextLine = rawLines[i + 1];
                            if (isQtyPriceLine(nextLine)) {
                                const nums = extractNumbers(nextLine);
                                if (nums.length > 0) {
                                    const price = nums[nums.length - 1];
                                    const nameCandidate = cleanItemName(line);

                                    if (nameCandidate.length >= 2 && price > 0 && !isIgnoredRow(nameCandidate.toLowerCase())) {
                                        items.push({
                                            name: nameCandidate,
                                            price: this.formatNumber(price)
                                        });
                                        i++;
                                        continue;
                                    }
                                }
                            }
                        }
                    }

                    if (!detectedSubtotal && items.length > 0) {
                        const sum = items.reduce((acc, it) => acc + this.parseNum(it.price), 0);
                        if (sum > 0) detectedSubtotal = sum;
                    }

                    if (!detectedTotal && detectedSubtotal) {
                        detectedTotal = detectedSubtotal;
                    }

                    return {
                        subtotal: detectedSubtotal ? this.formatNumber(detectedSubtotal) : null,
                        total: detectedTotal ? this.formatNumber(detectedTotal) : null,
                        items,
                        rawText: text
                    };
                },

                reparseRawText() {
                    if (!this.ocrResult || !this.ocrResult.rawText) return;
                    const parsed = this.parseReceiptText(this.ocrResult.rawText);
                    this.ocrResult.subtotal = parsed.subtotal;
                    this.ocrResult.total = parsed.total;
                    this.ocrResult.items = parsed.items;
                    this.ocrTab = 'result';
                    this.ocrStatus = `Berhasil mendeteksi ${parsed.items.length} item menu!`;
                    this.showToast(`Berhasil mendeteksi ${parsed.items.length} item menu`);
                },

                addOcrItem() {
                    this.ocrResult.items.push({
                        name: `Menu ${this.ocrResult.items.length + 1}`,
                        price: '0'
                    });
                },

                removeOcrItem(idx) {
                    this.ocrResult.items.splice(idx, 1);
                },

                applyOcrToCalculator() {
                    if (this.ocrResult.subtotal) {
                        this.state.total_price = this.ocrResult.subtotal;
                    } else if (this.ocrResult.items.length > 0) {
                        const sum = this.ocrResult.items.reduce((acc, it) => acc + this.parseNum(it.price), 0);
                        if (sum > 0) this.state.total_price = this.formatNumber(sum);
                    }

                    if (this.ocrResult.total) {
                        this.state.total_ammount = this.ocrResult.total;
                    }

                    if (this.ocrResult.items.length > 0) {
                        const baseTime = Date.now();
                        this.state.persons = this.ocrResult.items.map((it, idx) => ({
                            id: baseTime + idx,
                            name: it.name || `Orang ${idx + 1}`,
                            price: it.price,
                            roundingAdjustment: 0
                        }));
                    }

                    this.saveToStorage();
                    this.showOcrModal = false;
                    this.showToast('Data struk berhasil dimasukkan ke kalkulator!');
                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 45, spread: 70, origin: { y: 0.5 } });
                    }
                }
            };
        }
    </script>
</body>

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>BagiPromo - Kalkulator Patungan Diskon GoFood, GrabFood & ShopeeFood</title>
    <meta name="description"
        content="Kalkulator patungan online untuk bagi diskon makanan Gojek, GrabFood, dan ShopeeFood secara adil dan proporsional. Dilengkapi fitur scan struk otomatis (OCR), koreksi pembulatan, dan kirim ke WhatsApp.">
    <meta name="keywords"
        content="kalkulator patungan, bagi promo, hitung diskon makanan, split bill makanan, diskon gofood, diskon grabfood, patungan shopeefood, scan struk ocr, bagi tagihan proporsional">
    <meta name="author" content="Mulia Abdi">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://calculator.muliaabdi.net/">
    <meta name="theme-color" content="#00AA13">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://calculator.muliaabdi.net/">
    <meta property="og:title" content="BagiPromo - Kalkulator Patungan Diskon GoFood, GrabFood & ShopeeFood">
    <meta property="og:description"
        content="Hitung pembagian patungan diskon makanan secara proporsional dan adil saat pesan bareng. Lengkap dengan fitur scan struk otomatis, koreksi pembulatan, dan bagikan ke WhatsApp.">
    <meta property="og:site_name" content="BagiPromo">
    <meta property="og:locale" content="id_ID">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://calculator.muliaabdi.net/">
    <meta name="twitter:title" content="BagiPromo - Kalkulator Patungan Diskon Makanan">
    <meta name="twitter:description"
        content="Hitung patungan diskon makanan Gojek, Grab, ShopeeFood proporsional & adil dengan scan struk otomatis.">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BagiPromo",
      "url": "https://calculator.muliaabdi.net/",
      "description": "Kalkulator patungan online untuk bagi diskon makanan Gojek, GrabFood, dan ShopeeFood secara adil dan proporsional dilengkapi pemindaian struk otomatis.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "All",
      "inLanguage": "id-ID",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "IDR"
      },
      "featureList": [
        "Pembagian diskon makanan secara proporsional",
        "Pemindaian struk otomatis dengan kamera / galeri (OCR)",
        "Koreksi pembulatan selisih tagihan otomatis",
        "Ekspor hasil patungan teks dan gambar struk ke WhatsApp",
        "Penyimpanan lokal otomatis (LocalStorage)"
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Alpine.js & Tailwind CSS CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for celebrate -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <!-- html2canvas for exporting receipt as image -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#F0FDF4',
                            100: '#DCFCE7',
                            200: '#BBF7D0',
                            500: '#00AA13', // Gojek signature green
                            600: '#008F10',
                            700: '#00730C',
                            dark: '#0B2E13'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] {
            display: none !important;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
            -webkit-tap-highlight-color: transparent;
        }

        /* Prevent auto-zoom on iOS inputs */
        input,
        select,
        textarea {
            font-size: 16px !important;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 9999px;
        }

        /* Safe area for mobile home indicators */
        .safe-bottom {
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }
    </style>
</head>

<body class="min-h-screen flex flex-col antialiased selection:bg-brand-100 selection:text-brand-700">

    <div id="app" x-data="calculator()" x-cloak class="flex-1 flex flex-col pb-20 sm:pb-24">

        <!-- Top App Bar -->
        <header
            class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
            <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div
                        class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20 shrink-0">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="5" x2="5" y2="19"></line>
                            <circle cx="6.5" cy="6.5" r="2.5"></circle>
                            <circle cx="17.5" cy="17.5" r="2.5"></circle>
                        </svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h1 class="font-extrabold text-base sm:text-lg text-slate-900 leading-tight">BagiPromo</h1>
                        </div>
                        <p class="text-xs text-slate-500 font-medium" x-text="t('appSubtitle')"></p>
                    </div>
                </div>

                <div class="flex items-center gap-1.5 sm:gap-2">
                    <!-- Toggle Bahasa ID / EN -->
                    <div
                        class="inline-flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200/80 text-[11px] font-bold shrink-0">
                        <button @click="setLanguage('id')" type="button"
                            :class="lang === 'id' ? 'bg-white text-emerald-800 shadow-2xs font-extrabold' : 'text-slate-500 hover:text-slate-700'"
                            class="px-1.5 py-1 rounded-md transition" title="Bahasa Indonesia">
                            ID
                        </button>
                        <button @click="setLanguage('en')" type="button"
                            :class="lang === 'en' ? 'bg-white text-emerald-800 shadow-2xs font-extrabold' : 'text-slate-500 hover:text-slate-700'"
                            class="px-1.5 py-1 rounded-md transition" title="English">
                            EN
                        </button>
                    </div>

                    <button @click="showScanPickerModal = true" type="button"
                        class="px-2.5 py-1.5 text-xs font-semibold text-emerald-700 hover:text-emerald-800 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200/80 rounded-lg transition active:scale-95 flex items-center gap-1.5 shadow-2xs group"
                        :title="t('scanReceipt')">
                        <svg class="w-3.5 h-3.5 text-emerald-600 group-hover:scale-110 transition-transform"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                            </path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        <span x-text="t('scanReceipt')"></span>
                    </button>

                    <!-- Input 1: Kamera Belakang Langsung (capture=environment) -->
                    <input type="file" x-ref="cameraInput" accept="image/*" capture="environment" class="hidden"
                        @change="handleReceiptImageUpload($event)">

                    <!-- Input 2: Album Galeri / File Screenshot -->
                    <input type="file" x-ref="galleryInput" accept="image/*" class="hidden"
                        @change="handleReceiptImageUpload($event)">

                    <button @click="resetAll" type="button"
                        class="px-2.5 py-1.5 text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-lg transition active:scale-95 flex items-center gap-1"
                        :title="t('reset')">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"></path>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                        </svg>
                        <span class="hidden sm:inline" x-text="t('reset')"></span>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 pt-3 sm:pt-5 w-full space-y-4 sm:space-y-5">

            <!-- Parameter Struk Card -->
            <section
                class="bg-white rounded-2xl p-4 sm:p-6 border border-slate-200/90 shadow-sm relative overflow-hidden">
                <div
                    class="flex flex-col sm:flex-row sm:items-center justify-between pb-3 mb-4 border-b border-slate-100 gap-2">
                    <div class="flex items-center gap-2">
                        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-700"
                            x-text="t('receiptParams')"></h2>
                    </div>

                    <template x-if="sumMenuPrices > 0">
                        <div class="flex items-center gap-2">
                            <button @click="applySumAsOriginalPrice" type="button"
                                class="text-xs text-brand-600 hover:text-brand-700 font-semibold bg-brand-50 hover:bg-brand-100 px-2.5 py-1 rounded-md transition flex items-center gap-1">
                                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                                <span><span x-text="t('useMenuSum')"></span> (Rp <span
                                        x-text="formatNumber(sumMenuPrices)"></span>)</span>
                            </button>
                        </div>
                    </template>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Total Kotor Sebelum Diskon -->
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label for="total_price" class="text-xs font-bold text-slate-700 flex items-center gap-1">
                                <span x-text="t('totalBeforeDiscount')"></span>
                                <span class="text-slate-400 font-normal" x-text="t('receiptOriginal')"></span>
                            </label>
                        </div>
                        <div class="relative group">
                            <span
                                class="absolute left-3.5 top-1/2 -translate-y-1/2 font-bold text-sm text-slate-400 group-focus-within:text-brand-600 transition">Rp</span>
                            <input id="total_price" type="text" inputmode="numeric" x-model="state.total_price"
                                placeholder="Contoh: 120.000" @keypress="numberOnly($event)"
                                @input="onFormatInput($event, state, 'total_price')"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 placeholder:text-slate-300 placeholder:font-normal focus:bg-white focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none transition shadow-sm">
                        </div>
                    </div>

                    <!-- Total Akhir Dibayar -->
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label for="total_ammount"
                                class="text-xs font-bold text-emerald-800 flex items-center gap-1">
                                <span x-text="t('totalPaid')"></span>
                                <span class="text-emerald-600 font-normal" x-text="t('afterVoucher')"></span>
                            </label>
                        </div>
                        <div class="relative group">
                            <span
                                class="absolute left-3.5 top-1/2 -translate-y-1/2 font-bold text-sm text-emerald-600">Rp</span>
                            <input id="total_ammount" type="text" inputmode="numeric" x-model="state.total_ammount"
                                placeholder="Contoh: 75.000" @keypress="numberOnly($event)"
                                @input="onFormatInput($event, state, 'total_ammount')"
                                class="w-full pl-11 pr-4 py-3 bg-emerald-50/60 border border-emerald-300 rounded-xl font-bold text-emerald-900 placeholder:text-emerald-300 placeholder:font-normal focus:bg-white focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none transition shadow-sm">
                        </div>
                    </div>
                </div>

                <!-- Live Saving Stats Banner -->
                <template x-if="isValidParameters">
                    <div
                        class="mt-4 p-3.5 rounded-xl bg-gradient-to-r from-emerald-50 via-teal-50 to-emerald-50 border border-emerald-200/80 flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                            <div
                                class="w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center shadow-sm shrink-0">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z">
                                    </path>
                                    <line x1="7" y1="7" x2="7.01" y2="7"></line>
                                </svg>
                            </div>
                            <div>
                                <div class="text-xs font-semibold text-emerald-900" x-text="t('discountSaving')"></div>
                                <div class="text-sm font-extrabold text-emerald-700">
                                    <span><span x-text="t('saved')"></span> Rp <span
                                            x-text="formatNumber(totalDiscountAmount)"></span></span>
                                    <span
                                        class="text-xs font-bold px-1.5 py-0.5 rounded bg-emerald-200/80 text-emerald-800 ml-1">
                                        <span x-text="discountPercentage"></span>% <span x-text="t('off')"></span>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="text-right text-xs text-slate-500 font-medium">
                            <span x-text="t('payRatio') + ': '"></span><span class="font-bold text-slate-700"><span
                                    x-text="payRatioPercent"></span>%</span> <span x-text="t('ofMenuPrice')"></span>
                        </div>
                    </div>
                </template>
            </section>

            <!-- Menu / Pemesan Section -->
            <section class="space-y-3">
                <div class="flex items-center justify-between px-1">
                    <div>
                        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-700"
                            x-text="t('menuAndDiners')"></h2>
                        <p class="text-xs text-slate-400" x-text="t('menuDinersSubtitle')"></p>
                    </div>
                    <span class="text-xs font-semibold px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full">
                        <span x-text="state.persons.length"></span> Menu
                    </span>
                </div>

                <!-- Cards List -->
                <div class="relative space-y-3">
                    <template x-for="(person, idx) in state.persons" :key="person.id">
                        <div
                            class="bg-white rounded-2xl p-3.5 sm:p-4 border border-slate-200/80 shadow-sm hover:border-slate-300 hover:shadow-md transition-all group relative">

                            <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
                                <!-- Nomor urut & Nama Pemesan -->
                                <div class="flex items-center gap-2 flex-1 min-w-[140px]">
                                    <div
                                        class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center shrink-0">
                                        <span x-text="idx + 1"></span>
                                    </div>
                                    <input type="text" x-model="person.name"
                                        :placeholder="t('itemPlaceholder') + ' ' + (idx + 1)"
                                        class="w-full px-3 py-2 text-sm font-semibold text-slate-800 placeholder:text-slate-300 bg-transparent hover:bg-slate-50 focus:bg-white border border-transparent hover:border-slate-200 focus:border-slate-300 rounded-lg outline-none transition">
                                </div>

                                <!-- Input Harga Menu -->
                                <div class="w-full sm:w-44 shrink-0">
                                    <div class="relative">
                                        <span
                                            class="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">Rp</span>
                                        <input type="text" inputmode="numeric" x-model="person.price"
                                            :placeholder="t('pricePlaceholder')" @keypress="numberOnly($event)"
                                            @input="onFormatInput($event, person, 'price')"
                                            class="w-full pl-9 pr-3 py-2 text-sm font-bold text-slate-800 bg-slate-50 hover:bg-white focus:bg-white border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/10 rounded-xl outline-none transition">
                                    </div>
                                </div>

                                <!-- Panah indikator (Desktop only) -->
                                <div class="hidden sm:flex text-slate-300 items-center justify-center shrink-0">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                        <polyline points="12 5 19 12 12 19"></polyline>
                                    </svg>
                                </div>

                                <!-- Hasil Bayar Bersih -->
                                <div
                                    class="flex-1 w-full bg-emerald-50/70 border border-emerald-200/80 rounded-xl px-3.5 py-2 flex items-center justify-between sm:justify-start sm:gap-3 min-h-[48px]">
                                    <div class="flex flex-col">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-700/80"
                                            x-text="t('netPay')"></span>
                                        <div class="text-base sm:text-lg font-extrabold text-emerald-800 leading-tight">
                                            <span x-show="isValidParameters && parseNum(person.price) > 0">
                                                Rp <span x-text="formatNumber(calculatePersonShare(person))"></span>
                                            </span>
                                            <span x-show="!isValidParameters || !parseNum(person.price)"
                                                class="text-slate-300 font-semibold text-sm">
                                                -
                                            </span>
                                        </div>
                                    </div>

                                    <!-- Hemat Badge -->
                                    <div x-show="isValidParameters && parseNum(person.price) > 0 && calculatePersonSaving(person) > 0"
                                        class="text-right sm:ml-auto">
                                        <span
                                            class="text-[11px] font-bold text-emerald-700 bg-emerald-200/70 px-2 py-0.5 rounded-full inline-block">
                                            <span x-text="t('saved')"></span> Rp <span
                                                x-text="formatNumber(calculatePersonSaving(person))"></span>
                                        </span>
                                    </div>
                                </div>

                                <!-- Delete button -->
                                <button x-show="state.persons.length > 1" @click="removeRow(idx)" type="button"
                                    class="w-8 h-8 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 flex items-center justify-center transition active:scale-90 self-end sm:self-center shrink-0"
                                    title="Hapus baris">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path
                                            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                        </path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Tombol Tambah Menu -->
                <button @click="addRow" type="button"
                    class="w-full py-3.5 bg-white hover:bg-slate-50 border-2 border-dashed border-slate-300 hover:border-brand-500 rounded-2xl text-slate-600 hover:text-brand-600 font-bold text-sm transition flex items-center justify-center gap-2 group shadow-sm active:scale-[0.99]">
                    <div
                        class="w-6 h-6 rounded-full bg-slate-100 group-hover:bg-brand-100 text-slate-500 group-hover:text-brand-600 flex items-center justify-center transition">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </div>
                    <span x-text="t('addMenu')"></span>
                </button>
            </section>

            <!-- Rekapitulasi & Validasi Selisih -->
            <template x-if="isValidParameters">
                <section class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/90 shadow-sm space-y-3">
                    <div class="flex items-center justify-between">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500"
                            x-text="t('statusValidation')"></h3>
                        <span
                            :class="roundingDifference === 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'"
                            class="text-xs font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full"
                                :class="roundingDifference === 0 ? 'bg-emerald-500' : 'bg-amber-500'"></span>
                            <span
                                x-text="roundingDifference === 0 ? t('exact100') : (t('diffLabel') + ' ' + t('roundingDiff'))"></span>
                        </span>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-1">
                        <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                            <div class="text-[11px] font-semibold text-slate-400" x-text="t('receiptTotal')"></div>
                            <div class="text-base font-bold text-slate-800">Rp <span
                                    x-text="formatNumber(parsedTotalAmount)"></span></div>
                        </div>
                        <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                            <div class="text-[11px] font-semibold text-slate-400" x-text="t('splitResultTotal')"></div>
                            <div class="text-base font-bold text-slate-800">Rp <span
                                    x-text="formatNumber(totalAllocatedShare)"></span></div>
                        </div>
                        <div class="col-span-2 sm:col-span-1 p-3 rounded-xl border"
                            :class="roundingDifference === 0 ? 'bg-emerald-50/50 border-emerald-200' : 'bg-amber-50/70 border-amber-200'">
                            <div class="text-[11px] font-semibold"
                                :class="roundingDifference === 0 ? 'text-emerald-700' : 'text-amber-700'"
                                x-text="t('roundingDiff')"></div>
                            <div class="text-base font-extrabold flex items-center justify-between"
                                :class="roundingDifference === 0 ? 'text-emerald-800' : 'text-amber-900'">
                                <span><span x-text="roundingDifference > 0 ? '+' : ''"></span>Rp <span
                                        x-text="formatNumber(roundingDifference)"></span></span>
                                <template x-if="roundingDifference !== 0">

            <div @click.outside="showScanPickerModal = false"

                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                    <div>
                        <h3 class="font-bold text-slate-900 text-sm" x-text="t('scanPickerTitle')">Pindai Struk</h3>
                        <p class="text-xs text-slate-500" x-text="t('scanPickerSubtitle')">Pilih sumber foto struk

                            <line x1="6" y1="6" x2="18" y2="18"></line>

                <div class="space-y-2">

                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                                </path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-xs sm:text-sm text-slate-900" x-text="t('openCamera')">Buka
                                Kamera</div>
                            <div class="text-[11px] text-slate-500" x-text="t('openCameraDesc')">Ambil foto struk
                                langsung</div>
                        </div>
                    </button>

                    <button @click="showScanPickerModal = false; $refs.galleryInput.click()" type="button"
                        class="w-full p-3 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200/80 text-left transition flex items-center gap-3 active:scale-[0.99]">
                        <div
                            class="w-10 h-10 rounded-lg bg-white border border-slate-200/80 text-slate-700 flex items-center justify-center shrink-0">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-xs sm:text-sm text-slate-900" x-text="t('chooseGallery')">

                            <div class="text-[11px] text-slate-500" x-text="t('chooseGalleryDesc')">Unggah foto atau

        <!-- Modal Hasil Pindai Struk OCR -->
        <div x-show="showOcrModal" x-transition.opacity.duration.150ms
            class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-xs">
            <div @click.outside="showOcrModal = false"
                class="bg-white w-full max-w-lg rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col max-h-[92vh]">

                <!-- Header -->
                <div
                    class="px-5 py-3.5 bg-white border-b border-slate-200/80 flex items-center justify-between shrink-0">
                    <div class="flex items-center gap-2.5">
                        <div
                            class="w-8 h-8 rounded-lg bg-slate-100 text-slate-700 flex items-center justify-center shrink-0">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                                </path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-sm text-slate-900 leading-tight" x-text="t('ocrModalTitle')">Hasil
                                Pindai Struk</h3>
                            <p class="text-xs text-slate-500" x-text="t('ocrModalSubtitle')">Periksa dan sesuaikan data
                                sebelum diterapkan</p>
                        </div>
                    </div>

                    <button @click="showOcrModal = false" type="button"
                        class="p-1.5 text-slate-400 hover:text-slate-700 rounded-lg hover:bg-slate-100 transition"
                        title="Tutup">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="p-4 overflow-y-auto space-y-4 flex-1 bg-slate-50/50">

                    <!-- Scanning State -->
                    <template x-if="ocrScanning">
                        <div class="py-12 text-center space-y-4">
                            <div
                                class="w-28 h-36 mx-auto rounded-xl overflow-hidden border border-slate-200 shadow-sm bg-slate-100 relative">
                                <img :src="ocrPreviewUrl" class="w-full h-full object-cover" alt="Preview Struk">
                            </div>

                            <div class="space-y-1.5 max-w-xs mx-auto">
                                <div class="flex justify-between text-xs font-semibold text-slate-700">
                                    <span x-text="ocrStatus"></span>
                                    <span class="text-slate-900 font-mono"><span x-text="ocrProgress"></span>%</span>
                                </div>
                                <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                                    <div class="bg-brand-500 h-full rounded-full transition-all duration-200"
                                        :style="'width: ' + ocrProgress + '%'"></div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Scan Results Ready -->
                    <template x-if="!ocrScanning">
                        <div class="space-y-3.5">
                            <!-- Tab Switcher -->
                            <div class="flex items-center justify-between gap-2">
                                <div class="inline-flex bg-slate-200/70 p-1 rounded-xl text-xs font-semibold">
                                    <button @click="ocrTab = 'result'" type="button"
                                        :class="ocrTab === 'result' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'"
                                        class="px-3 py-1.5 rounded-lg transition" x-text="t('detectedTab')">
                                        Hasil Deteksi
                                    </button>
                                    <button @click="ocrTab = 'raw'" type="button"
                                        :class="ocrTab === 'raw' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'"
                                        class="px-3 py-1.5 rounded-lg transition" x-text="t('rawTextTab')">
                                        Teks Mentah
                                    </button>
                                </div>

                                <button @click="showOcrModal = false; showScanPickerModal = true" type="button"
                                    class="text-xs font-semibold text-slate-600 hover:text-slate-900 bg-white border border-slate-200 px-2.5 py-1.5 rounded-lg transition shadow-2xs flex items-center gap-1">
                                    <span x-text="t('changePhoto')">Ganti Foto</span>
                                </button>
                            </div>

                            <!-- Tab 1: Form Hasil Ekstraksi -->
                            <div x-show="ocrTab === 'result'" class="space-y-3">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div
                                        class="bg-white p-3 rounded-xl border border-slate-200/90 shadow-2xs space-y-1">
                                        <label class="text-[11px] font-semibold text-slate-500"
                                            x-text="t('totalBeforeDiscount')">Total Sebelum Diskon</label>
                                        <div class="relative">
                                            <span
                                                class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">Rp</span>
                                            <input type="text" inputmode="numeric" x-model="ocrResult.subtotal"
                                                placeholder="Contoh: 120.000" @keypress="numberOnly($event)"
                                                @input="onFormatInput($event, ocrResult, 'subtotal')"
                                                class="w-full pl-8 pr-2.5 py-1.5 text-xs font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:bg-white focus:border-brand-500">
                                        </div>
                                    </div>

                                    <div
                                        class="bg-white p-3 rounded-xl border border-slate-200/90 shadow-2xs space-y-1">
                                        <label class="text-[11px] font-semibold text-slate-500"
                                            x-text="t('totalPaid')">Total Akhir Dibayar</label>
                                        <div class="relative">
                                            <span
                                                class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-brand-600">Rp</span>
                                            <input type="text" inputmode="numeric" x-model="ocrResult.total"
                                                placeholder="Contoh: 75.000" @keypress="numberOnly($event)"
                                                @input="onFormatInput($event, ocrResult, 'total')"
                                                class="w-full pl-8 pr-2.5 py-1.5 text-xs font-bold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:bg-white focus:border-brand-500">
                                        </div>
                                    </div>
                                </div>

                                <!-- Menu Items list -->
                                <div
                                    class="bg-white p-3.5 rounded-xl border border-slate-200/90 shadow-2xs space-y-2.5">
                                    <div class="flex items-center justify-between">
                                        <div class="text-xs font-bold text-slate-700 flex items-center gap-1">
                                            <span x-text="t('detectedMenus')">Menu Terdeteksi</span>
                                            <span>(</span>
                                            <span x-text="ocrResult.items.length"></span>
                                            <span>):</span>
                                        </div>
                                        <button @click="addOcrItem" type="button"
                                            class="text-xs font-semibold text-brand-600 hover:text-brand-700 bg-brand-50 hover:bg-brand-100 px-2 py-1 rounded-md transition flex items-center gap-1">
                                            <span x-text="t('addMenuBtn')">+ Tambah</span>
                                        </button>
                                    </div>

                                    <template x-if="ocrResult.items.length === 0">
                                        <div class="py-4 text-center text-xs text-slate-400"
                                            x-text="t('noMenuDetected')">
                                            Tidak ada menu yang terbaca otomatis. Silakan tambah manual atau cek tab
                                            Teks Mentah.
                                        </div>
                                    </template>

                                    <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
                                        <template x-for="(it, idx) in ocrResult.items" :key="idx">
                                            <div
                                                class="flex items-center gap-2 p-2 rounded-xl bg-slate-50 border border-slate-100">
                                                <input type="text" x-model="it.name" :placeholder="t('itemPlaceholder')"
                                                    class="flex-1 px-2.5 py-1.5 text-xs font-medium text-slate-800 bg-white border border-slate-200 rounded-lg outline-none focus:border-brand-500">

                                                <div class="relative w-28 shrink-0">
                                                    <span
                                                        class="absolute left-2 top-1/2 -translate-y-1/2 text-[10px] font-bold text-slate-400">Rp</span>
                                                    <input type="text" inputmode="numeric" x-model="it.price"
                                                        :placeholder="t('pricePlaceholder')"
                                                        @keypress="numberOnly($event)"
                                                        @input="onFormatInput($event, it, 'price')"
                                                        class="w-full pl-6 pr-2 py-1.5 text-xs font-bold text-slate-800 bg-white border border-slate-200 rounded-lg outline-none focus:border-brand-500">
                                                </div>

                                                <button @click="removeOcrItem(idx)" type="button"
                                                    class="p-1 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                                                    title="Hapus baris">
                                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none"
                                                        stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                        stroke-linejoin="round">
                                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                                    </svg>
                                                </button>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <!-- Tab 2: Raw OCR Text -->
                            <div x-show="ocrTab === 'raw'" class="space-y-2.5">
                                <div class="flex items-center justify-between gap-2">
                                    <p class="text-[11px] text-slate-500" x-text="t('rawTextHint')"></p>
                                    <button 
                                        @click="reparseRawText" 
                                        type="button" 
                                        class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-brand-50 hover:bg-brand-100 text-brand-700 border border-brand-200/80 transition flex items-center gap-1.5 shrink-0 shadow-2xs active:scale-95">
                                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                                        <span x-text="t('reparseBtn')">Ekstraksi Ulang</span>
                                    </button>
                                </div>
                                <textarea 
                                    x-model="ocrResult.rawText" 
                                    rows="9"
                                    class="w-full p-3 font-mono text-xs text-slate-800 bg-white border border-slate-200 rounded-xl outline-none focus:border-brand-500 leading-relaxed select-all">
                                </textarea>
                            </div>

                        </div>
                    </template>

                </div>

                <!-- Modal Actions -->
                <div
                    class="p-3.5 sm:p-4 bg-white border-t border-slate-200 shrink-0 flex items-center justify-between gap-2">
                    <button @click="showOcrModal = false" type="button"
                        class="px-4 py-2.5 rounded-xl font-semibold text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 transition"
                        x-text="t('cancel')">
                        Batal
                    </button>

                    <button @click="applyOcrToCalculator" type="button" :disabled="ocrScanning"
                        class="flex-1 py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm bg-brand-500 hover:bg-brand-600 disabled:opacity-50 text-white shadow-sm transition flex items-center justify-center gap-1.5 active:scale-95">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span x-text="t('applyToCalculator')">Terapkan ke Kalkulator</span>
                    </button>
                </div>

            </div>
        </div>

        <!-- Toast Notification -->
        <div x-show="toastMessage" x-transition.opacity.duration.200ms
            class="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 backdrop-blur-md text-white px-4 py-2 rounded-full text-xs font-semibold shadow-xl border border-slate-700/50 flex items-center gap-2">
            <span x-text="toastMessage"></span>
        </div>

    </div>

            id: {
                appSubtitle: "Bagi Tagihan & Diskon Makanan Adil",
                scanReceipt: "Scan Struk",

                discountSaving: "Total Penghematan Diskon",
                saved: "Hemat",

                payRatio: "Rasio Bayar",
                ofMenuPrice: "dari harga menu",
                menuAndDiners: "Daftar Menu & Pemesan",

        function calculator() {
            const STORAGE_KEY = 'bagi_promo_v2';
            const LANG_KEY = 'bagi_promo_lang';
            const STATS_KEY = 'bagi_promo_lifetime_stats';
            const KV_BUCKET = 'Lm8Q83y1s7Tt7Cn41FQvJk';
            const KV_URL = `https://kvdb.io/${KV_BUCKET}/stats`;

            return {
                lang: 'id',
                state: {
                    persons: [
                        { id: 1, name: 'Orang 1', price: null, roundingAdjustment: 0 },
                        { id: 2, name: 'Orang 2', price: null, roundingAdjustment: 0 },
                        { id: 3, name: 'Orang 3', price: null, roundingAdjustment: 0 }
                    ],
                    total_price: null,
                    total_ammount: null,
                    payment_info: ''
                },
                stats: {
                    totalBilled: 100000,
                    totalSaved: 35000,
                    count: 1
                },
                showShareModal: false,
                shareTab: 'text',
                copied: false,
                copyingImage: false,
                toastMessage: '',
                lastRecordedHash: '',

                // OCR Scanner State (Tesseract.js Client-Side)
                showScanPickerModal: false,
                showOcrModal: false,
                ocrScanning: false,
                ocrProgress: 0,
                ocrStatus: '',
                ocrPreviewUrl: '',
                ocrTab: 'result', // 'result' | 'raw'
                ocrResult: {
                    subtotal: null,
                    total: null,
                    items: [],
                    rawText: ''
                },

                init() {
                    const savedLang = localStorage.getItem(LANG_KEY);
                    if (savedLang === 'id' || savedLang === 'en') {
                        this.lang = savedLang;
                    }
                    this.loadFromStorage();
                    this.loadStats();
                    this.$watch('state', () => {
                        this.saveToStorage();
                    });
                },

                setLanguage(l) {
                    this.lang = l;
                    try {
                        localStorage.setItem(LANG_KEY, l);
                    } catch (e) { }
                },

                t(key) {
                    const dict = I18N[this.lang] || I18N.id;
                    return dict[key] || I18N.id[key] || key;
                },

                // Helper: trigger notification toast
                showToast(msg) {
                    this.toastMessage = msg;
                    setTimeout(() => {
                        this.toastMessage = '';
                    }, 2500);
                },

                // Getters
                get currentClock() {
                    const d = new Date();
                    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                },
                get currentAppUrl() {
                    if (typeof window !== 'undefined' && window.location && window.location.href.includes('http')) {
                        return window.location.href.split('?')[0];
                    }
                    return 'https://calculator.muliaabdi.net/';
                },
                get parsedTotalPrice() {
                    return this.parseNum(this.state.total_price);
                },
                get parsedTotalAmount() {
                    return this.parseNum(this.state.total_ammount);
                },
                get isValidParameters() {
                    return this.parsedTotalPrice > 0 && this.parsedTotalAmount > 0;
                },
                get sumMenuPrices() {
                    return this.state.persons.reduce((acc, p) => acc + this.parseNum(p.price), 0);
                },
                get totalDiscountAmount() {
                    if (!this.isValidParameters) return 0;
                    return Math.max(0, this.parsedTotalPrice - this.parsedTotalAmount);
                },
                get discountPercentage() {
                    if (!this.isValidParameters || this.parsedTotalPrice === 0) return 0;
                    const pct = ((this.parsedTotalPrice - this.parsedTotalAmount) / this.parsedTotalPrice) * 100;
                    return Math.round(pct);
                },
                get payRatioPercent() {
                    if (!this.isValidParameters || this.parsedTotalPrice === 0) return 100;
                    const ratio = (this.parsedTotalAmount / this.parsedTotalPrice) * 100;
                    return Math.round(ratio * 10) / 10;
                },
                get totalAllocatedShare() {
                    return this.state.persons.reduce((sum, p) => sum + this.calculatePersonShare(p), 0);
                },
                get roundingDifference() {
                    if (!this.isValidParameters) return 0;
                    return this.totalAllocatedShare - this.parsedTotalAmount;
                },
                get activePersons() {
                    return this.state.persons.filter(p => this.parseNum(p.price) > 0);
                },

                // Number helpers
                parseNum(val) {
                    if (!val) return 0;
                    const cleaned = val.toString().replace(/[^0-9]/g, '');
                    return cleaned ? parseInt(cleaned, 10) : 0;
                },
                formatNumber(val) {
                    if (val === null || val === undefined || val === '') return '0';
                    const num = typeof val === 'number' ? Math.round(val) : this.parseNum(val);
                    return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                },

                // Share calculation
                calculatePersonShare(person) {
                    const price = this.parseNum(person.price);
                    if (!price || !this.isValidParameters) return 0;
                    const baseShare = Math.round((price / this.parsedTotalPrice) * this.parsedTotalAmount);
                    return baseShare + (person.roundingAdjustment || 0);
                },
                calculatePersonSaving(person) {
                    const price = this.parseNum(person.price);
                    if (!price || !this.isValidParameters) return 0;
                    const share = this.calculatePersonShare(person);
                    return Math.max(0, price - share);
                },

                // Row operations
                addRow() {
                    const nextId = this.state.persons.length > 0 ? Math.max(...this.state.persons.map(p => p.id)) + 1 : 1;
                    this.state.persons.push({
                        id: nextId,
                        name: `Orang ${this.state.persons.length + 1}`,
                        price: null,
                        roundingAdjustment: 0
                    });
                },
                removeRow(index) {
                    if (this.state.persons.length > 1) {
                        this.state.persons.splice(index, 1);
                    }
                },

                // Input handling
                numberOnly(evt) {
                    const charCode = evt.which ? evt.which : evt.keyCode;
                    if (charCode > 31 && (charCode < 48 || charCode > 57)) {
                        evt.preventDefault();
                    }
                },
                onFormatInput(evt, targetObj, key) {
                    const raw = evt.target.value.replace(/[^0-9]/g, '');
                    if (!raw) {
                        targetObj[key] = null;
                        evt.target.value = '';
                        return;
                    }
                    const formatted = this.formatNumber(parseInt(raw, 10));
                    targetObj[key] = formatted;
                    evt.target.value = formatted;
                    if (key === 'price') {
                        targetObj.roundingAdjustment = 0;
                    }
                },
                applySumAsOriginalPrice() {
                    if (this.sumMenuPrices > 0) {
                        this.state.total_price = this.formatNumber(this.sumMenuPrices);
                        this.showToast(`Total struk diset ke Rp ${this.formatNumber(this.sumMenuPrices)}`);
                    }
                },
                autoFixRounding() {
                    if (this.roundingDifference === 0 || this.state.persons.length === 0) return;
                    const target = this.state.persons.find(p => this.parseNum(p.price) > 0) || this.state.persons[0];
                    if (target) {
                        target.roundingAdjustment = (target.roundingAdjustment || 0) - this.roundingDifference;
                        this.showToast('Selisih pembulatan berhasil dipaskan!');
                        if (typeof confetti === 'function') {
                            confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
                        }
                    }
                },

                // Storage
                saveToStorage() {
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
                    } catch (e) {
                        console.error('Storage error', e);
                    }
                },
                loadFromStorage() {
                    try {
                        const saved = localStorage.getItem(STORAGE_KEY);
                        if (saved) {
                            const parsed = JSON.parse(saved);
                            if (parsed && Array.isArray(parsed.persons)) {
                                this.state.persons = parsed.persons;
                                this.state.total_price = parsed.total_price || null;
                                this.state.total_ammount = parsed.total_ammount || null;
                                this.state.payment_info = parsed.payment_info || '';
                            }
                        }
                    } catch (e) {
                        console.error('Load storage error', e);
                    }
                },

                // Stats
                async loadStats() {
                    try {
                        const raw = localStorage.getItem(STATS_KEY);
                        if (raw) {
                            const data = JSON.parse(raw);
                            this.stats.totalBilled = Math.max(this.stats.totalBilled, Number(data.totalBilled) || 0);
                            this.stats.totalSaved = Math.max(this.stats.totalSaved, Number(data.totalSaved) || 0);
                            this.stats.count = Math.max(this.stats.count, Number(data.count) || 0);
                        }
                    } catch (e) { }

                    try {
                        const res = await fetch(KV_URL);
                        if (res.ok) {
                            const cloudData = await res.json();
                            if (cloudData && typeof cloudData === 'object') {
                                this.stats.totalBilled = Number(cloudData.totalBilled) || this.stats.totalBilled;
                                this.stats.totalSaved = Number(cloudData.totalSaved) || this.stats.totalSaved;
                                this.stats.count = Number(cloudData.count) || this.stats.count;
                                localStorage.setItem(STATS_KEY, JSON.stringify(this.stats));
                            }
                        }
                    } catch (err) { }
                },
                async saveStats() {
                    try {
                        localStorage.setItem(STATS_KEY, JSON.stringify(this.stats));
                    } catch (e) { }

                    try {
                        await fetch(KV_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                totalBilled: this.stats.totalBilled,
                                totalSaved: this.stats.totalSaved,
                                count: this.stats.count
                            })
                        });
                    } catch (err) { }
                },
                recordCalculation() {
                    if (!this.isValidParameters) return;
                    const billed = this.parsedTotalAmount;
                    const saved = this.totalDiscountAmount;
                    const hash = `${this.parsedTotalPrice}-${billed}`;
                    if (hash !== this.lastRecordedHash && billed > 0) {
                        this.lastRecordedHash = hash;
                        this.stats.totalBilled += billed;
                        this.stats.totalSaved += saved;
                        this.stats.count += 1;
                        this.saveStats();
                    }
                },

                // Reset
                resetAll() {
                    if (confirm(this.t('resetConfirm'))) {
                        this.state.persons = [
                            { id: 1, name: this.lang === 'en' ? 'Person 1' : 'Orang 1', price: null, roundingAdjustment: 0 },
                            { id: 2, name: this.lang === 'en' ? 'Person 2' : 'Orang 2', price: null, roundingAdjustment: 0 }
                        ];
                        this.state.total_price = null;
                        this.state.total_ammount = null;
                        // Info pembayaran sengaja dipertahankan agar tidak perlu mengetik ulang
                        this.saveToStorage();
                        this.showToast(this.t('resetToast'));
                    }
                },

                // Copy app URL
                async copyAppUrl() {
                    try {
                        await navigator.clipboard.writeText(this.currentAppUrl);
                        this.showToast(this.t('linkCopiedToast'));
                        if (typeof confetti === 'function') {
                            confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
                        }
                    } catch (e) {
                        this.showToast('Link: ' + this.currentAppUrl);
                    }
                },

                // WhatsApp message generator
                generateWhatsAppMessage() {
                    const lines = [];
                    const url = this.currentAppUrl;
                    const isEn = this.lang === 'en';

                    lines.push(isEn ? '*FOOD BILL SPLIT DETAILS*' : '*RINCIAN PATUNGAN MAKANAN*');
                    lines.push('─────────────────────────────');

                    if (this.parsedTotalPrice && this.parsedTotalAmount) {
                        lines.push(isEn ? '*Bill Summary:*' : '*Ringkasan Tagihan:*');
                        lines.push(`• ${isEn ? 'Original Menu' : 'Total Menu Asli'} : Rp ${this.formatNumber(this.parsedTotalPrice)}`);
                        lines.push(`• ${isEn ? 'Amount Paid' : 'Total Dibayar'}   : *Rp ${this.formatNumber(this.parsedTotalAmount)}*`);
                        lines.push(`• ${isEn ? 'Discount Savings' : 'Hemat Diskon'}    : *Rp ${this.formatNumber(this.totalDiscountAmount)} (${this.discountPercentage}% OFF)*`);
                        lines.push('─────────────────────────────');
                    }

                    lines.push(isEn ? '*Payment Breakdown per Person:*' : '*Rincian Bayar per Orang:*');
                    let count = 0;

                    this.state.persons.forEach((p, idx) => {
                        const price = this.parseNum(p.price);
                        if (price > 0) {
                            count++;
                            const share = this.calculatePersonShare(p);
                            const saving = this.calculatePersonSaving(p);
                            const defaultName = isEn ? `Person ${idx + 1}` : `Orang ${idx + 1}`;
                            const name = p.name ? p.name.trim() : defaultName;

                            lines.push(`\n${count}. *${name}*`);
                            lines.push(`   ├ ${isEn ? 'Menu Price' : 'Harga Menu'} : Rp ${this.formatNumber(price)}`);
                            if (saving > 0) {
                                lines.push(`   ├ ${isEn ? 'Discount' : 'Diskon'}     : Rp ${this.formatNumber(saving)}`);
                            }
                            lines.push(`   └ *${isEn ? 'Net Pay' : 'Bayar'}      : Rp ${this.formatNumber(share)}*`);
                        }
                    });

                    lines.push('\n─────────────────────────────');
                    lines.push(`*${isEn ? 'TOTAL BILLED' : 'TOTAL DITAGIH'} : Rp ${this.formatNumber(this.totalAllocatedShare)}*`);

                    if (this.state.payment_info && this.state.payment_info.trim()) {
                        lines.push('\n─────────────────────────────');
                        lines.push(isEn ? '*Payment / Transfer Info:*' : '*Info Pembayaran / Transfer:*');
                        lines.push(this.state.payment_info.trim());
                    }

                    lines.push('\n─────────────────────────────');
                    lines.push((isEn ? '_Calculated with:_ ' : '_Dihitung via:_ ') + url);

                    return lines.join('\n');
                },

                // Share modal actions
                openShareModal() {
                    this.recordCalculation();
                    this.showShareModal = true;
                    this.shareTab = 'text';
                    this.copied = false;
                },
                async copyToClipboard() {
                    this.recordCalculation();
                    const text = this.generateWhatsAppMessage();
                    try {
                        await navigator.clipboard.writeText(text);
                        this.copied = true;
                        this.showToast('Teks berhasil disalin ke clipboard!');
                        if (typeof confetti === 'function') {
                            confetti({ particleCount: 40, spread: 70, origin: { y: 0.6 } });
                        }
                        setTimeout(() => {
                            this.copied = false;
                        }, 2500);
                    } catch (err) {
                        const textarea = document.createElement('textarea');
                        textarea.value = text;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        this.copied = true;
                        this.showToast('Teks berhasil disalin!');
                    }
                },
                openWhatsAppDirect() {
                    this.recordCalculation();
                    const text = encodeURIComponent(this.generateWhatsAppMessage());
                    window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
                },

                // Image receipt export via html2canvas
                async copyImageReceipt() {
                    const el = document.getElementById('receipt-card');
                    if (!el || typeof html2canvas !== 'function') {
                        this.showToast('Fitur gambar belum siap');
                        return;
                    }
                    this.copyingImage = true;
                    try {
                        const h2cOptions = {
                            scale: 3,
                            backgroundColor: '#DCF8C6',
                            useCORS: true,
                            logging: false,
                            scrollY: 0,
                            scrollX: 0,
                            onclone: (clonedDoc) => {
                                const clonedEl = clonedDoc.getElementById('receipt-card');
                                if (clonedEl) {
                                    clonedEl.style.overflow = 'visible';
                                    let parent = clonedEl.parentElement;
                                    while (parent && parent !== clonedDoc.body) {
                                        parent.style.overflow = 'visible';
                                        parent.style.maxHeight = 'none';
                                        parent.style.height = 'auto';
                                        parent = parent.parentElement;
                                    }
                                }
                            }
                        };
                        const canvas = await html2canvas(el, h2cOptions);

                        canvas.toBlob(async (blob) => {
                            if (!blob) {
                                this.showToast('Gagal memproses gambar');
                                this.copyingImage = false;
                                return;
                            }
                            try {
                                if (navigator.clipboard && window.ClipboardItem && navigator.clipboard.write) {
                                    await navigator.clipboard.write([
                                        new ClipboardItem({ 'image/png': blob })
                                    ]);
                                    this.showToast('Gambar struk tersalin! Paste (Ctrl+V) langsung di WA');
                                } else {
                                    const link = document.createElement('a');
                                    link.download = 'struk-patungan.png';
